<div class="login-container">
<h2>Iniciar Sesión</h2>

<form (ngSubmit)="login()">
    <div>
    <label>Email</label>
    <input type="email" [(ngModel)]="usernameOrEmail" name="usernameOrEmail" required placeholder="Tu correo" />
    </div>

    <div>
    <label>Contraseña</label>
    <input type="password" [(ngModel)]="password" name="password" required placeholder="Tu contraseña" />
    </div>

    <button type="submit">Ingresar</button>
</form>

<p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

<div class="success-check" *ngIf="success">
    <svg viewBox="0 0 70 70">
    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
    <path class="check-mark" fill="none" d="M14 27l7 7 16-16"/>
    </svg>
</div>
</div>
