<button class="home-btn" [routerLink]="['/']">
    Home
</button>

<div class="login-container">
    
<h2>Iniciar Sesión</h2>

<form (ngSubmit)="login()">
    <div>
    <label>Email / Username</label>
    <input type="email" [(ngModel)]="usernameOrEmail" name="usernameOrEmail" required placeholder="Tu correo" />
    </div>

    <div>
    <label>Contraseña</label>
    <div class="password-wrapper">
        <input 
        [type]="showPassword ? 'text' : 'password'" 
        [(ngModel)]="password" 
        name="password" 
        required 
        placeholder="Tu contraseña" 
        />
        <span class="toggle-password" (click)="showPassword = !showPassword">
        <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
        </span>
    </div>
    </div>

    <button type="submit">Ingresar</button>
</form>

<p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

<button 
class="verify-email-btn"
[routerLink]="['/auth/verify-email']" 
[queryParams]="{ fromLogin: true, email: usernameOrEmail }">
Verificar correo
</button>

<p>¿No tienes una cuenta? 
    <a routerLink="/auth/register">Regístrate</a>

<div class="success-check" *ngIf="success">
    <svg viewBox="0 0 70 70">
    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
    <path class="check-mark" fill="none" d="M14 27l7 7 16-16"/>
    </svg>
</div>
</div>
