<button (click)="confirmLogout()" class="logout">Logout</button>

<div class="confirm-modal" [class.show]="showConfirmModal">
<div class="confirm-box">
    <p>¿Estás seguro que quieres salir?</p>
    <div class="buttons">
    <button class="cancel" (click)="cancelLogout()">No</button>
    <button class="confirm" (click)="logout()">Sí</button>
    </div>
</div>
</div>

<div class="logout-animation" *ngIf="showLogoutAnimation">
<div class="spinner"></div>
<p>Saliendo...</p>
</div>


<div class="ai-page-wrapper">
<div class="sidebar" [class.show]="sidebarVisible">
    <h3>Historial</h3>
    <button class="new-chat" (click)="newChat()">+ Nuevo Chat</button>
    <ul>
    <li class="history-item" 
        *ngFor="let item of history"
        (click)="loadChat(item)">
        <span>{{ item.prompt }}</span>
        <button class="menu-btn" (click)="toggleMenu(item, $event)">⋮</button>
        <div class="menu" *ngIf="item.showMenu">
        <button (click)="toggleDelete(item.id)">Eliminar</button>
        </div>
    </li>
    </ul>
</div>

<div class="mobile-menu-btn" (click)="sidebarVisible = !sidebarVisible" [class.active]="sidebarVisible">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="chat-panel">
    <h2>OLLAMA AI</h2>

    <div #responsesContainer class="responses">
    <div *ngFor="let r of responses" class="response" [ngClass]="r.sender">
        <p *ngFor="let line of r.text">{{ line }}</p>
    </div>
    </div>

    <div *ngIf="selectedImagePreview" class="image-preview-container">
    <img [src]="selectedImagePreview" alt="Previsualización" class="image-preview" />
    <button (click)="removeImage()" class="remove-image-button" [disabled]="loading">&times;</button>
    </div>

    <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display:none;" id="imageUpload">

    <form (ngSubmit)="askQuestion()" class="chat-form">
    <div class="model-select">
        <label for="model">Modelo:</label>
        <select id="model" [(ngModel)]="selectedModel" name="model" (change)="onModelChange()" [disabled]="loading">
        <option *ngFor="let m of models" [value]="m.value">{{ m.name }}</option>
        </select>
    </div>

    <div class="input-group">
        <button 
        *ngIf="selectedModel.includes('gemma3')"
        type="button" 
        class="attach-button"
        [ngClass]="{'attached': selectedImageFile}"
        (click)="fileInput.click()"
        [disabled]="loading"
        >
        <span *ngIf="!selectedImageFile">📎</span>
        <span *ngIf="selectedImageFile">🖼️</span>
        </button>

        <input type="text" [(ngModel)]="prompt" name="prompt" placeholder="Escribe tu pregunta..." required [disabled]="loading">
        <button type="submit" [disabled]="loading">Enviar</button>
    </div>
    </form>

    <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="theme-selector">
    <button class="theme-button" (click)="toggleThemes()">🎨 Personalizar</button>

    <div class="themes-dropdown" *ngIf="showThemes">
        <div 
        class="theme-option" 
        *ngFor="let theme of themes"
        [style.background]="theme.preview"
        (click)="changeTheme(theme)"
        [class.selected]="selectedTheme === theme.name"
        >
        {{ theme.name | titlecase }}
        </div>

        <div *ngIf="selectedTheme === 'personalizado'" class="custom-colors">
        <label>Color 1:</label>
        <input type="color" [(ngModel)]="customColor1" (change)="updateCustomTheme()">

        <label>Color 2:</label>
        <input type="color" [(ngModel)]="customColor2" (change)="updateCustomTheme()">
        </div>
    </div>
    </div>

</div>
</div>

<div class="confirm-modal" [class.show]="showConfirm">
<div class="confirm-box">
    <p>¿Seguro que quieres eliminar este registro?</p>
    <div class="buttons">
    <button class="cancel" (click)="cancelDelete()">Cancelar</button>
    <button class="confirm" (click)="confirmDelete()">Eliminar</button>
    </div>
</div>
</div>
